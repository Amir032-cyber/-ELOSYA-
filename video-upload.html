<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publier une vidéo — Elosya</title><link rel="stylesheet" href="app-pages.css"></head><body data-page="upload"><header class="app-header"></header><main class="page" id="page-content"><section class="hero"><div class="eyebrow">Créateurs</div><h1>Publier une vidéo</h1><p>Prépare ton contenu pour la communauté. L’envoi réel sera relié à l’API vidéo dès que le stockage sera configuré.</p></section><div class="card form"><form onsubmit="event.preventDefault();document.querySelector('#upload-status').innerHTML='<div class=\"notice success\">Vidéo préparée localement. Configure l’API et le stockage pour lancer l’envoi réel.</div>'"><div class="field"><label>Titre</label><input required maxlength="100"></div><div class="field"><label>Fichier vidéo</label><input type="file" accept="video/*" required></div><button class="btn" type="submit">Préparer la publication</button><div id="upload-status" style="margin-top:14px"></div></form></div></main><footer class="footer"></footer><script src="app-pages.js"></script></body></html>
